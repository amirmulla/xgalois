name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Bazel Build & Test (${{ matrix.compiler }}, C++20)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.11.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.compiler }}
          repository-cache: true

      - name: Build library and examples
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          bazel build --cxxopt=-std=c++20 //xgalois/... //example/...

      - name: Run unit tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          bazel test --cxxopt=-std=c++20 //test:galois_field_tests --test_output=errors

  cmake-build-and-test:
    name: CMake Build, Test & Install (${{ matrix.compiler }}, C++20)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (C++20)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DXGALOIS_BUILD_TESTS=ON \
            -DXGALOIS_BUILD_EXAMPLES=ON

      - name: Build library, tests, and examples
        run: |
          cmake --build build --parallel 2

      - name: Run CTest unit tests
        run: |
          ctest --test-dir build --output-on-failure --parallel "$(nproc)"

      - name: Install XGalois package
        run: |
          cmake --install build --prefix /tmp/xgalois_install

      - name: Verify downstream find_package(xgalois CONFIG REQUIRED)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf /tmp/xgalois_consumer
          mkdir -p /tmp/xgalois_consumer
          cat <<'EOF' > /tmp/xgalois_consumer/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(xgalois_consumer LANGUAGES CXX)
          find_package(xgalois CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE xgalois::xgalois)
          EOF
          cat <<'EOF' > /tmp/xgalois_consumer/main.cpp
          #include <cstdint>
          #include <iostream>
          #include <memory>
          #include "xgalois/field/gf_array.hpp"
          #include "xgalois/field/gf_binary.hpp"
          int main() {
            auto gf = std::make_shared<xg::GF2X<uint8_t>>(8);
            auto arr = xg::GFArray<xg::GF2X<uint8_t>>::Zeros(gf, {3});
            std::cout << "GF(" << gf->Order() << ") array size=" << arr.Size() << "\n";
            return (gf->Order() == 256 && arr.Size() == 3) ? 0 : 1;
          }
          EOF
          cmake -S /tmp/xgalois_consumer -B /tmp/xgalois_consumer/build \
            -DCMAKE_PREFIX_PATH=/tmp/xgalois_install \
            -DCMAKE_CXX_STANDARD=20
          cmake --build /tmp/xgalois_consumer/build
          /tmp/xgalois_consumer/build/consumer

  sanitizers:
    name: Sanitizers (ASan & UBSan, C++20)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@0.11.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-sanitizers
          repository-cache: true

      - name: Run tests with ASan
        run: |
          bazel test --cxxopt=-std=c++20 --config=asan //test:galois_field_tests --test_output=errors

      - name: Run tests with UBSan
        run: |
          bazel test --cxxopt=-std=c++20 --config=ubsan //test:galois_field_tests --test_output=errors

  clang-format:
    name: Clang-Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          DIRS=(xgalois test example)
          if [ -d python/src ]; then
            DIRS+=(python/src)
          fi
          find "${DIRS[@]}" -type f \( -name '*.hpp' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror {} +

  docs:
    name: Sphinx Documentation Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Doxygen and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install -r doc/requirements.txt

      - name: Build Sphinx documentation
        run: |
          sphinx-build -b html doc doc/_build/html

  sage-oracle:
    name: SageMath 10.5 Live Differential Oracle
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure CMake and C++20 compiler are installed
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y cmake g++
          fi

      - name: Build xgalois_oracle_cli inside Sage container (ABI-safe)
        run: |
          cmake -S . -B build-oracle \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DXGALOIS_BUILD_TESTS=OFF \
            -DXGALOIS_BUILD_EXAMPLES=OFF \
            -DXGALOIS_BUILD_ORACLE=ON
          cmake --build build-oracle --target xgalois_oracle_cli --parallel 2

      - name: Verify golden JSON freshness (zero drift)
        run: |
          sage -python test/oracle/sage/generate_golden.py \
            --seed=2026 --check-dir=test/oracle/golden

      - name: Run live differential oracle suite
        run: |
          TRIALS=${{ github.event_name == 'schedule' && '2500' || '250' }}
          sage -python test/oracle/sage/live_oracle.py \
            --cli=build-oracle/xgalois_oracle_cli \
            --seed=2026 --trials="${TRIALS}"
